name: Refresh social preview

on:
  push:
    paths:
      - '.github/workflows/refresh-social-preview.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download new social cover
        env:
          SHARE_URL_B64: ""
        run: |
          set -euo pipefail
          mkdir -p public/media/social
          SHARE_URL="$(printf '%s' "$SHARE_URL_B64" | base64 -d)"
          curl -L --fail --retry 3 --retry-delay 2 "$SHARE_URL" -o public/media/social/korax-share-20261008.png
          file public/media/social/korax-share-20261008.png
          ls -lh public/media/social/korax-share-20261008.png

      - name: Update Open Graph metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          s=s.replace("Korax | Atendimento inteligente para WhatsApp","Korax | Operação comercial inteligente para WhatsApp")
          s=s.replace("Centralize seus WhatsApps, organize sua equipe e acompanhe oportunidades com CRM, inteligência artificial, agenda e follow-up.","Transforme seu WhatsApp em uma operação comercial inteligente com atendimento, CRM, follow-up, agenda e IA.")
          s=s.replace("https://usekorax.com/media/social/korax-share-20261004.jpg","https://usekorax.com/media/social/korax-share-20261008.png")
          s=s.replace('<meta property="og:image:type" content="image/jpeg" />','<meta property="og:image:type" content="image/png" />')
          s=s.replace('<meta property="og:image:width" content="1730" />','<meta property="og:image:width" content="1731" />')
          s=s.replace('<meta property="og:image:alt" content="Korax: Seu WhatsApp. Uma operação comercial. Atendimento, CRM e inteligência artificial." />','<meta property="og:image:alt" content="Korax: transforme seu WhatsApp em uma operação comercial inteligente." />')
          s=s.replace('<meta name="twitter:image:alt" content="Korax: Seu WhatsApp. Uma operação comercial. Atendimento, CRM e inteligência artificial." />','<meta name="twitter:image:alt" content="Korax: transforme seu WhatsApp em uma operação comercial inteligente." />')
          p.write_text(s)
          PY

      - name: Commit social preview update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/social/korax-share-20261008.png index.html
          git commit -m "feat: update Korax social share preview"
          git push
