name: Replace Korax VSL

on:
  push:
    paths:
      - '.github/workflows/replace-korax-vsl.yml'

permissions:
  contents: write

jobs:
  replace-vsl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download and optimize new VSL
        env:
          VSL_SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/064a5997-77f6-467d-bf45-bb8ab61ff606.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2ExYWNiZjFlZTBhZTRlMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU3NjE3N30.med0sLxo7NItP-4XMUBJFmVCFjB5nSQVWUBl3H0_KDc"
        run: |
          set -euo pipefail
          mkdir -p public/media/vsl
          curl -L --fail --retry 3 --retry-delay 2 "$VSL_SOURCE_URL" -o /tmp/korax-vsl-source.mp4

          ffmpeg -y -i /tmp/korax-vsl-source.mp4 \
            -c:v libx264 -preset veryfast -crf 28 \
            -pix_fmt yuv420p -movflags +faststart \
            -c:a aac -b:a 64k -ac 2 \
            public/media/vsl/korax-vsl.mp4

          ffmpeg -y -ss 00:00:01 -i public/media/vsl/korax-vsl.mp4 \
            -frames:v 1 -vf "scale=512:-2" \
            -c:v libwebp -quality 82 \
            public/media/vsl/korax-vsl-poster.webp

          ls -lh public/media/vsl/korax-vsl.mp4 public/media/vsl/korax-vsl-poster.webp

      - name: Commit new VSL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/vsl/korax-vsl.mp4 public/media/vsl/korax-vsl-poster.webp
          git commit -m "media: replace Korax landing VSL"
          git push
