name: Import product WebP assets

on:
  push:
    paths:
      - '.github/workflows/import-product-webp.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare image tools
        run: python -m pip install --quiet pillow

      - name: Download source images
        env:
          EMAIL_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/8573f997-b320-43cd-b828-7cf3c01e7a6e.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODllODVkMTNkNTMyZGEzMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQ1NTU3MX0.xZhAizdf8SMODAwKTzY6JhX28s3IOfue3WDzoxIutKQ"
          FORMS_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/24d74a68-0ae8-428e-9a32-0d2f737f5c7b.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzM4MGJlOGJjYWRmOGUzNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQ5MjQyN30.qbLuNy-hnqxg5o6Vjm8yO584Y0I5Qk7Ljjig_Pl1kzg"
          SIGN_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/e317a219-7480-4a80-be3b-9c2f9f973464.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTI3NGFiNGM2ZTZjNTMwZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjQzMjcxNn0.rhHsK-fFZpFjdFXADCWp0LbFtqvY9XiPjbb1IKZ1GWc"
        run: |
          set -euo pipefail
          mkdir -p /tmp/korax-product public/media/product
          curl -L --fail --retry 3 "$EMAIL_URL" -o /tmp/korax-product/email.png
          curl -L --fail --retry 3 "$FORMS_URL" -o /tmp/korax-product/formularios.png
          curl -L --fail --retry 3 "$SIGN_URL" -o /tmp/korax-product/korax-sign.png

      - name: Convert PNG to optimized WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/korax-product')
          dst = Path('public/media/product')
          items = {
              'email.png': 'email.webp',
              'formularios.png': 'formularios.webp',
              'korax-sign.png': 'korax-sign.webp',
          }

          for source, target in items.items():
              image = Image.open(src / source).convert('RGB')
              if image.width > 1200:
                  height = round(image.height * 1200 / image.width)
                  image = image.resize((1200, height), Image.Resampling.LANCZOS)
              image.save(dst / target, 'WEBP', quality=84, method=6)
              print(target, image.size, (dst / target).stat().st_size)
          PY
          ls -lh public/media/product/email.webp public/media/product/formularios.webp public/media/product/korax-sign.webp

      - name: Commit WebP product assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/product/email.webp public/media/product/formularios.webp public/media/product/korax-sign.webp
          git commit -m "media: add email forms and Sign product images"
          git push
