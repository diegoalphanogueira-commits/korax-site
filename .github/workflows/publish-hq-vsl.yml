name: Publish HQ VSL

on:
  push:
    paths:
      - '.github/workflows/publish-hq-vsl.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download HQ VSL
        env:
          VSL_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/73f6d177-b35e-44ea-b4ec-ae1fdf0c20a5.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzVhYzNkNzk3MDM0ZDcyZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTYwOTk3N30.0ZC_ECUy58RvCWPHpl0gR3FwV_7qJAfzX5RX2kjX7q0"
        run: |
          set -euo pipefail
          mkdir -p public/media/vsl
          curl -L --fail --retry 3 --retry-delay 2 "$VSL_URL" -o public/media/vsl/korax-vsl.mp4
          ffmpeg -y -ss 00:00:01 -i public/media/vsl/korax-vsl.mp4 -frames:v 1 -vf "scale=512:-2" -c:v libwebp -quality 86 public/media/vsl/korax-vsl-poster.webp
          ls -lh public/media/vsl/korax-vsl.mp4 public/media/vsl/korax-vsl-poster.webp

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/vsl/korax-vsl.mp4
          git commit -m "media: publish higher quality Korax VSL"
          git push
